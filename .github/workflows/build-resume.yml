# Rebuilds assets/files/resume.pdf from resume/resume.tex and commits it back
# to main, which GitHub Pages then publishes like any other change.
name: Build resume

on:
  push:
    branches: [main]
    paths:
      - resume/**
      - .github/workflows/build-resume.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-resume
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compile resume.tex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          working_directory: resume
          latexmk_use_xelatex: true

      - name: Commit rebuilt PDF
        run: |
          cp resume/resume.pdf assets/files/resume.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/files/resume.pdf
          if git diff --cached --quiet; then
            echo "resume.pdf is unchanged"
            exit 0
          fi
          git commit -m "Rebuild resume.pdf from resume/resume.tex"
          git pull --rebase origin main
          git push
